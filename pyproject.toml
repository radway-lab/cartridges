[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cartridges"
version = "0.0.1"
description = "Lightweight and general-purpose long-context representations"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "openai",
    "datasets",
    "transformers==5.19.0",
    "numpy",
    "einops",
    "tqdm",
    "wandb",
    "pydrantic",
    "tiktoken",
    "peft",
    "evaluate",
    "matplotlib",
    "markdown", "pyarrow", "pandas", "scipy", "rich", "httpx", "mcp"
]



[tool.setuptools.packages.find]
include = ["cartridges*", "examples*"]

[tool.setuptools.package-data]
cartridges = ["initialization/data/*.txt", "data/**/*.txt"]
