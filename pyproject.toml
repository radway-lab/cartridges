[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radway-cartridges"
version = "0.1.0"
description = "Self-study KV cartridges for Granite 350M and small Qwen models"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "transformers==5.19.0", "safetensors>=0.4"]

[project.scripts]
cartridges = "radway_cartridges.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
